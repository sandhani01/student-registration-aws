name: Deploy to Amazon EC2 via AWS Systems Manager

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m pytest tests/test_app.py -v

  deploy:
    name: Deploy to EC2 via AWS SSM
    needs: test
    runs-on: ubuntu-latest

    env:
      AWS_REGION: "us-east-1"
      EC2_INSTANCE_ID: "i-09a305ec90d53a8ba"
      EC2_PUBLIC_IP: "100.48.182.11"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Deployment via AWS SSM Run Command
        id: ssm_deploy
        run: |
          echo "Dispatching deployment command to EC2 instance ${{ env.EC2_INSTANCE_ID }} via AWS SSM..."

          # Define the deployment commands to be executed on the EC2 instance
          SSM_COMMANDS=$(cat << 'EOF'
          set -e
          APP_DIR="/opt/student-registration"
          cd "${APP_DIR}"

          # Update repository files if running in git repo
          if [ -d .git ]; then
              sudo -u ec2-user git pull origin main || true
          fi

          # Ensure deploy script exists and is executable
          if [ -f "${APP_DIR}/deploy/deploy_ec2.sh" ]; then
              chmod +x "${APP_DIR}/deploy/deploy_ec2.sh"
              bash "${APP_DIR}/deploy/deploy_ec2.sh"
          else
              echo "Executing standalone service restart..."
              systemctl daemon-reload
              systemctl restart student-registration.service || true
              systemctl restart nginx || true
              curl -s http://127.0.0.1/health || true
          fi
          EOF
          )

          # Send command through AWS SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions automated deployment to ${{ env.EC2_INSTANCE_ID }}" \
            --parameters commands=["${SSM_COMMANDS}"] \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command dispatched. CommandId: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT

      - name: Wait for SSM Command & Inspect Output
        run: |
          COMMAND_ID="${{ steps.ssm_deploy.outputs.command_id }}"
          echo "Polling SSM execution status for CommandId: ${COMMAND_ID} on ${{ env.EC2_INSTANCE_ID }}..."

          # Wait for execution completion
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" || true

          # Retrieve full execution details and output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}")

          STATUS=$(echo "${OUTPUT}" | jq -r '.Status')
          STDOUT=$(echo "${OUTPUT}" | jq -r '.StandardOutputContent')
          STDERR=$(echo "${OUTPUT}" | jq -r '.StandardErrorContent')

          echo "=========================================================="
          echo "SSM Execution Status: ${STATUS}"
          echo "=========================================================="
          echo "Standard Output:"
          echo "${STDOUT}"

          if [ "${STDERR}" != "null" ] && [ -n "${STDERR}" ]; then
              echo "Standard Error:"
              echo "${STDERR}"
          fi

          if [ "${STATUS}" != "Success" ]; then
              echo "ERROR: SSM command did not complete successfully (Status: ${STATUS})."
              exit 1
          fi

      - name: Public Health Check Verification
        run: |
          echo "Verifying public endpoint at http://${{ env.EC2_PUBLIC_IP }}/health..."
          curl --fail --retry 5 --retry-delay 3 --connect-timeout 5 "http://${{ env.EC2_PUBLIC_IP }}/health"
          echo -e "\nDeployment verified successfully at http://${{ env.EC2_PUBLIC_IP }}/"
