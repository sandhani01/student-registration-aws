# Nginx Configuration for Student Registration System
# Location on EC2: /etc/nginx/conf.d/student-registration.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Client payload limit
    client_max_body_size 10M;

    # Static assets serving (performance optimization)
    location /static/ {
        alias /opt/student-registration/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy all dynamic requests to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check bypass / monitoring
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
